name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Raylib build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          build-essential pkg-config libraylib-dev libgl1-mesa-dev libx11-dev libxkbcommon-dev libxcursor-dev
          libxi-dev libxinerama-dev libxrandr-dev

      - name: Build and test native C implementation
        run: make check

      - name: Build Raylib application
        run: make build
